name: CI

on:
  push:
    # Non-code changes cannot affect the build; skip CI entirely.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.projectmem/**'
      - '.clinerules/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.projectmem/**'
      - '.clinerules/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libfontconfig1-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Validate packaging metadata
        run: |
          desktop-file-validate packaging/linux/io.github.nandazahran.incuscubby.desktop
          bash -n packaging/linux/build-appimage.sh
          bash -n packaging/linux/build-deb.sh
          bash -n packaging/linux/build-rpm.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
